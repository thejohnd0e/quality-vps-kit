name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Offline test suite
        run: bash tests/run.sh
        env:
          QVK_REQUIRE_SHELLCHECK: "1"

      - name: Verify release metadata
        run: bash scripts/release.sh --check

      - name: Verify triggering tag matches VERSION
        run: |
          expected_tag="v$(cat VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "workflow: triggering tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)" >&2
            exit 1
          fi

      - name: Build release assets
        run: bash scripts/release.sh dist

      - name: Publish GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/quality-vps-kit-*.tar.gz dist/SHA256SUMS
          --title "quality-vps-kit ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published release
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          printf '%s\n' "$assets" | grep -Fxq -- "quality-vps-kit-${GITHUB_REF_NAME#v}.tar.gz"
          printf '%s\n' "$assets" | grep -Fxq -- "SHA256SUMS"
        env:
          GH_TOKEN: ${{ github.token }}
